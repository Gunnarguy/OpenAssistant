name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SCHEME: OpenAssistant
  PROJECT: OpenAssistant.xcodeproj

jobs:
  build-and-test:
    name: Build and Test iOS App
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          [ -z "$XCODE_PATH" ] && XCODE_PATH="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          if [ -f Podfile ]; then
            gem install cocoapods
            if [ -f Podfile.lock ]; then
              pod install --deployment
            else
              pod install --repo-update
            fi
          else
            echo "No Podfile found, skipping pod install"
          fi

      - name: Build for iOS Simulator
        run: |
          if [ -f OpenAssistant.xcworkspace/contents.xcworkspacedata ]; then
            xcodebuild clean build \
              -workspace OpenAssistant.xcworkspace \
              -scheme ${{ env.SCHEME }} \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild clean build \
              -project ${{ env.PROJECT }} \
              -scheme ${{ env.SCHEME }} \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          fi
