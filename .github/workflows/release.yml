name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          [ -z "$XCODE_PATH" ] && XCODE_PATH="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Install CocoaPods
        run: |
          if [ -f Podfile ]; then
            gem install cocoapods
            if [ -f Podfile.lock ]; then
              pod install --deployment
            else
              pod install --repo-update
            fi
          fi

      - name: Build for Release
        run: |
          if [ -f OpenAssistant.xcworkspace/contents.xcworkspacedata ]; then
            xcodebuild \
              -workspace OpenAssistant.xcworkspace \
              -scheme OpenAssistant \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Release \
              -derivedDataPath build/ \
              CODE_SIGNING_ALLOWED=NO \
              clean build
          else
            xcodebuild \
              -project OpenAssistant.xcodeproj \
              -scheme OpenAssistant \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Release \
              -derivedDataPath build/ \
              CODE_SIGNING_ALLOWED=NO \
              clean build
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## What's Changed
            - Auto-generated release from tag ${{ github.ref_name }}

            ## Installation
            1. Clone the repository
            2. Open in Xcode 26+
            3. Build and run on your device
            4. Add your OpenAI API key in Settings

            ## Requirements
            - iOS 26.0+
            - Xcode 26+
            - Valid OpenAI API key
          draft: false
          prerelease: false
