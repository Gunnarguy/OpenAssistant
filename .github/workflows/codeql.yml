name: "CodeQL Security Analysis"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Mondays at 6 AM UTC

jobs:
  analyze:
    name: Analyze
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["swift"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          [ -z "$XCODE_PATH" ] && XCODE_PATH="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Using: $(xcodebuild -version | head -1)"

      - name: Install CocoaPods
        run: |
          if [ -f Podfile ]; then
            gem install cocoapods
            if [ -f Podfile.lock ]; then
              pod install --deployment
            else
              pod install --repo-update
            fi
          fi

      - name: Build project
        run: |
          if [ -f OpenAssistant.xcworkspace/contents.xcworkspacedata ]; then
            xcodebuild clean build \
              -workspace OpenAssistant.xcworkspace \
              -scheme OpenAssistant \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild clean build \
              -project OpenAssistant.xcodeproj \
              -scheme OpenAssistant \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
